<!DOCTYPE html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/table.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="table__wrapper">
        <section class="table__header__section">
            <h1 class="table__header__section__title">موجودی محصولات</h1>
        </section>
        <section class="table__body__section">
          <table class="table">
            <thead class="table__header">
              <tr class="table__rows">
                <th class="table__head">ردیف</th>
                <th class="table__head">نام کالا</th>
                <th class="table__head">تعداد</th>
                <th class="table__head">تاریخ</th>
                <th class="table__head">قیمت</th>
                <th class="table__head">موجودی</th>
              </tr>
            </thead>
            <tbody class="table__body">
              <tr class="table__rows">
                <td class="table__data">1</td>
                <td class="table__data">لپ تاپ دل</td>
                <td class="table__data">20</td>
                <td class="table__data">2025/05/11</td>
                <td class="table__data table__data--price ">78_000_000</td>
                <td class="table__data success status">بله</td>
              </tr>
              <tr class="table__rows">
                <td class="table__data">2</td>
                <td class="table__data">لپ تاپ ایسوس</td>
                <td class="table__data">0</td>
                <td class="table__data">2025/05/08</td>
                <td class="table__data table__data--price ">99.000.000</td>
                <td class="table__data cancelled status">خیر</td>
              </tr>
              <tr class="table__rows">
                <td class="table__data">3</td>
                <td class="table__data">لپ تاپ ایسر</td>
                <td class="table__data">0</td>
                <td class="table__data">2025/05/08</td>
                <td class="table__data table__data--price ">99_000_000</td>
                <td class="table__data pending status">درحال تامین</td>
              </tr>
            </tbody>
            <tfoot class="table__footer"></tfoot>
          </table>
        </section>
          
        </div>
      </div>
    </div>
  </body>
</html>
